services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "${PORT:-8080}:8080"
    environment:
      HOMARR_AUTH_ENABLED: "${HOMARR_AUTH_ENABLED:-False}"
      HOMARR_SESSION_TOKEN: "${HOMARR_SESSION_TOKEN:-89abcdef0123456789abcdef0123456789abcdef0123456789abcdef01234567}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      homarr:
        condition: service_started
      homarr-init:
        condition: service_completed_successfully
    restart: unless-stopped

  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    environment:
      SECRET_ENCRYPTION_KEY: "${HOMARR_SECRET_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"
      DEMO_MODE: "true"
      DEMO_READ_ONLY: "false"
    volumes:
      - homarr-data:/appdata
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:7575').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
    restart: unless-stopped

  homarr-init:
    image: ghcr.io/homarr-labs/homarr:latest
    command: ["node", "/seed/init.mjs"]
    environment:
      HOMARR_SESSION_TOKEN: "${HOMARR_SESSION_TOKEN:-89abcdef0123456789abcdef0123456789abcdef0123456789abcdef01234567}"
    volumes:
      - homarr-data:/appdata
      - ./init.mjs:/seed/init.mjs:ro
    depends_on:
      homarr:
        condition: service_healthy
    restart: "no"

volumes:
  homarr-data:
