services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "${INDEX_PORT:-8080}:8080"
      - "${HOMEPAGE_PORT:-8081}:8081"
      - "${DASHY_PORT:-8082}:8082"
      - "${FLAME_PORT:-8083}:8083"
      - "${GLANCE_PORT:-8084}:8084"
      - "${JUMP_PORT:-8085}:8085"
      - "${LINKDING_PORT:-8086}:8086"
      - "${HOMARR_PORT:-8087}:8087"
      - "${HOMER_PORT:-8088}:8088"
    environment:
      INDEX_PORT: "${INDEX_PORT:-8080}"
      HOMEPAGE_PORT: "${HOMEPAGE_PORT:-8081}"
      DASHY_PORT: "${DASHY_PORT:-8082}"
      FLAME_PORT: "${FLAME_PORT:-8083}"
      GLANCE_PORT: "${GLANCE_PORT:-8084}"
      JUMP_PORT: "${JUMP_PORT:-8085}"
      LINKDING_PORT: "${LINKDING_PORT:-8086}"
      HOMARR_PORT: "${HOMARR_PORT:-8087}"
      HOMER_PORT: "${HOMER_PORT:-8088}"
      LINKDING_PROXY_USER: "${LD_SUPERUSER_NAME:-admin}"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/site:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      homepage:
        condition: service_started
      dashy:
        condition: service_started
      flame:
        condition: service_started
      glance:
        condition: service_started
      jump:
        condition: service_started
      linkding:
        condition: service_started
      linkding-init:
        condition: service_completed_successfully
      homarr:
        condition: service_started
      homer:
        condition: service_started
    restart: unless-stopped

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    environment:
      HOMEPAGE_ALLOWED_HOSTS: homepage:3000
    volumes:
      - ./homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      homepage.group: Dashboard samples
      homepage.name: Homepage
      homepage.icon: homepage.png
      homepage.href: "http://localhost:${HOMEPAGE_PORT:-8081}"
      homepage.description: Caddy経由で公開されるHomepage
    restart: unless-stopped

  dashy:
    image: lissy93/dashy:latest
    environment:
      NODE_ENV: production
    volumes:
      - ./dashy/user-data:/app/user-data
    restart: unless-stopped

  flame:
    image: pawelmalak/flame:latest
    environment:
      PASSWORD: "${FLAME_PASSWORD:-change-me}"
    volumes:
      - flame-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      flame.type: application
      flame.name: Flame sample
      flame.url: "http://localhost:${FLAME_PORT:-8083}"
      flame.icon: docker
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5005').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
    restart: unless-stopped

  flame-init:
    image: pawelmalak/flame:latest
    command: ["node", "/seed/seed.mjs"]
    environment:
      FLAME_URL: http://flame:5005
      FLAME_PASSWORD: "${FLAME_PASSWORD:-change-me}"
      SAMPLE_INDEX_NAME: Dashboard Index
      SAMPLE_INDEX_URL: "http://localhost:${INDEX_PORT:-8080}"
      SAMPLE_HOMEPAGE_URL: "http://localhost:${HOMEPAGE_PORT:-8081}"
      SAMPLE_DASHY_URL: "http://localhost:${DASHY_PORT:-8082}"
      SAMPLE_GLANCE_URL: "http://localhost:${GLANCE_PORT:-8084}"
      SAMPLE_JUMP_URL: "http://localhost:${JUMP_PORT:-8085}"
      SAMPLE_LINKDING_URL: "http://localhost:${LINKDING_PORT:-8086}"
      SAMPLE_HOMARR_URL: "http://localhost:${HOMARR_PORT:-8087}"
      SAMPLE_HOMER_URL: "http://localhost:${HOMER_PORT:-8088}"
    volumes:
      - flame-data:/app/data
      - ./flame/seed.mjs:/seed/seed.mjs:ro
    depends_on:
      flame:
        condition: service_healthy
    restart: "no"

  glance:
    image: glanceapp/glance:latest
    volumes:
      - ./glance/config:/app/config:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      glance.name: Glance sample
      glance.icon: si:glance
      glance.url: "http://localhost:${GLANCE_PORT:-8084}"
      glance.description: Caddy経由で公開されるGlance
    restart: unless-stopped

  jump:
    image: daledavies/jump:latest
    volumes:
      - ./jump/sites:/sites
      - ./jump/search:/search
    environment:
      SITENAME: Dashboard Lab
      SHOWCLOCK: "true"
      SHOWSEARCH: "true"
      CHECKSTATUS: "true"
      STATUSCACHE: "5"
      NOINDEX: "true"
      DOCKERPROXYURL: dockerproxy:2375
    labels:
      jump.name: Jump sample
      jump.url: "http://localhost:${JUMP_PORT:-8085}"
      jump.description: Caddy経由で公開されるJump
      jump.tags: home,docker
    depends_on:
      - dockerproxy
    restart: unless-stopped

  dockerproxy:
    image: tecnativa/docker-socket-proxy:latest
    environment:
      CONTAINERS: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  linkding:
    image: sissbruecker/linkding:latest
    environment:
      LD_SUPERUSER_NAME: "${LD_SUPERUSER_NAME:-admin}"
      LD_SUPERUSER_PASSWORD: "${LD_SUPERUSER_PASSWORD:-change-me}"
      LD_ENABLE_AUTH_PROXY: "${LINKDING_AUTH_BYPASS:-True}"
      LD_AUTH_PROXY_USERNAME_HEADER: HTTP_REMOTE_USER
    volumes:
      - linkding-data:/etc/linkding/data
    restart: unless-stopped

  linkding-init:
    image: sissbruecker/linkding:latest
    command: ["sh", "/seed/seed.sh"]
    environment:
      LD_SUPERUSER_NAME: "${LD_SUPERUSER_NAME:-admin}"
    volumes:
      - linkding-data:/etc/linkding/data
      - ./linkding/bookmarks.html:/seed/bookmarks.html:ro
      - ./linkding/seed.sh:/seed/seed.sh:ro
    depends_on:
      linkding:
        condition: service_healthy
    restart: "no"

  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    environment:
      SECRET_ENCRYPTION_KEY: "${HOMARR_SECRET_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"
    volumes:
      - homarr-data:/appdata
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      homepage.group: Dashboard samples
      homepage.name: Homarr
      homepage.icon: homarr.png
      homepage.href: "http://localhost:${HOMARR_PORT:-8087}"
      homepage.description: GUIで配置するHomelabダッシュボード
      glance.name: Homarr sample
      glance.icon: si:homarr
      glance.url: "http://localhost:${HOMARR_PORT:-8087}"
      glance.description: Caddy経由で公開されるHomarr
      jump.name: Homarr sample
      jump.url: "http://localhost:${HOMARR_PORT:-8087}"
      jump.description: GUI編集型のHomelabダッシュボード
      jump.tags: home,dashboard,gui
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:7575').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
    restart: unless-stopped

  homer:
    image: b4bz/homer:latest
    environment:
      INIT_ASSETS: "0"
    volumes:
      - ./homer/assets/config.yml:/www/assets/config.yml:ro
    labels:
      homepage.group: Dashboard samples
      homepage.name: Homer
      homepage.icon: homer.png
      homepage.href: "http://localhost:${HOMER_PORT:-8088}"
      homepage.description: Git管理しやすい静的YAMLランチャー
      glance.name: Homer sample
      glance.icon: si:homer
      glance.url: "http://localhost:${HOMER_PORT:-8088}"
      glance.description: Caddy経由で公開されるHomer
      jump.name: Homer sample
      jump.url: "http://localhost:${HOMER_PORT:-8088}"
      jump.description: 軽量な静的YAMLランチャー
      jump.tags: home,dashboard,yaml
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
  flame-data:
  linkding-data:
  homarr-data:
