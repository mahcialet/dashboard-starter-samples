services:
  flame:
    image: pawelmalak/flame:latest
    ports:
      - "${PORT:-8080}:5005"
    environment:
      PASSWORD: "${FLAME_PASSWORD:-change-me}"
    volumes:
      - flame-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      flame.type: application
      flame.name: Flame sample
      flame.url: "http://localhost:${PORT:-8080}"
      flame.icon: docker
    restart: unless-stopped

volumes:
  flame-data:
