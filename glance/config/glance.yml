server:
  port: 8080

pages:
  - name: Home
    columns:
      - size: small
        widgets:
          - type: calendar
            first-day-of-week: monday

          - type: bookmarks
            groups:
              - title: Dashboards
                links:
                  - title: Homepage
                    url: https://github.com/gethomepage/homepage
                  - title: Dashy
                    url: https://github.com/lissy93/dashy
                  - title: Flame
                    url: https://github.com/pawelmalak/flame
                  - title: Glance
                    url: https://github.com/glanceapp/glance
                  - title: Jump
                    url: https://github.com/daledavies/jump
                  - title: linkding
                    url: https://github.com/sissbruecker/linkding
              - title: Operations
                links:
                  - title: Docker
                    url: https://docs.docker.com/
                  - title: Caddy
                    url: https://caddyserver.com/docs/
                  - title: Glance docs
                    url: https://github.com/glanceapp/glance/tree/main/docs
                  - title: Awesome Selfhosted
                    url: https://github.com/awesome-selfhosted/awesome-selfhosted

          - type: monitor
            cache: 1m
            title: Public service status
            sites:
              - title: GitHub
                url: https://github.com/
                icon: si:github
              - title: Docker Hub
                url: https://hub.docker.com/
                icon: si:docker
              - title: Caddy
                url: https://caddyserver.com/
                icon: si:caddy

      - size: full
        widgets:
          - type: search
            search-engine: duckduckgo
            autofocus: true

          - type: rss
            title: Dashboard releases
            limit: 8
            collapse-after: 5
            cache: 1h
            feeds:
              - url: https://github.com/glanceapp/glance/releases.atom
                title: Glance
              - url: https://github.com/gethomepage/homepage/releases.atom
                title: Homepage
              - url: https://github.com/lissy93/dashy/releases.atom
                title: Dashy

          - type: hacker-news
            limit: 10
            collapse-after: 5

          - type: docker-containers
            hide-by-default: false

      - size: small
        widgets:
          - type: weather
            location: Tokyo, Japan
            units: metric
            hour-format: 24h

          - type: releases
            cache: 1d
            repositories:
              - glanceapp/glance
              - gethomepage/homepage
              - lissy93/dashy
              - daledavies/jump
              - sissbruecker/linkding
