services:
  glance:
    image: glanceapp/glance:latest
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./config:/app/config:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      glance.name: Glance sample
      glance.icon: si:glance
      glance.url: "http://localhost:${PORT:-8080}"
      glance.description: このComposeで動作中のGlance
    restart: unless-stopped
