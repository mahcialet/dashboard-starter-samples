services:
  jump:
    image: daledavies/jump:latest
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./sites:/sites
      - ./search:/search
    environment:
      SITENAME: Dashboard Lab
      SHOWCLOCK: "true"
      SHOWSEARCH: "true"
      CHECKSTATUS: "true"
      STATUSCACHE: "5"
      NOINDEX: "true"
      DOCKERPROXYURL: dockerproxy:2375
    labels:
      jump.name: Jump sample
      jump.url: "http://localhost:${PORT:-8080}"
      jump.description: Dockerラベルから検出されたJump
      jump.tags: home,docker
    depends_on:
      - dockerproxy
    restart: unless-stopped

  dockerproxy:
    image: tecnativa/docker-socket-proxy:latest
    environment:
      CONTAINERS: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
