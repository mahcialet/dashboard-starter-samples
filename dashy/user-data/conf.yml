pageInfo:
  title: Dashboard Lab
  description: Dashyのステータスチェック、RSS、テーマを試すサンプル
  navLinks:
    - title: Dashy documentation
      path: https://dashy.to/docs
    - title: GitHub
      path: https://github.com/lissy93/dashy

appConfig:
  theme: nord-frost
  layout: auto
  iconSize: medium
  statusCheck: true
  statusCheckInterval: 60
  statusCheckAccessibility: true

sections:
  - name: Dashboard projects
    icon: fas fa-gauge-high
    displayData:
      cols: 2
    items:
      - title: Dashy
        description: ソースコード、Issue、リリース
        url: https://github.com/lissy93/dashy
        icon: si-github
      - title: Docker
        description: Docker公式ドキュメント
        url: https://docs.docker.com/
        icon: si-docker
      - title: Self-Hosted
        description: セルフホスト関連のリンク集
        url: https://github.com/awesome-selfhosted/awesome-selfhosted
        icon: si-github

  - name: Latest releases
    icon: fas fa-rss
    displayData:
      cols: 1
    widgets:
      - type: rss-feed
        options:
          rssUrl: https://github.com/lissy93/dashy/releases.atom
          limit: 5
        useProxy: true
